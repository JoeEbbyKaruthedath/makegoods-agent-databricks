[project]
name = "makegoods-agent"
version = "0.1.0"
description = "Make-Goods seller-side agent: LangGraph + UC-function tools + Lakebase memory, served as an MLflow ResponsesAgent in a Databricks App"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-langchain[memory]>=0.19.0",
    "databricks-sdk>=0.81.0",
    "databricks-agents>=1.9.3",
    "mlflow>=3.10.1",
    "langgraph>=1.1.0",
    "python-dotenv>=1.2.1",
    "nest-asyncio>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server"]

[tool.uv]
# Dependency cooldown: skip package versions published in the last 7 days
exclude-newer = "7 days"
