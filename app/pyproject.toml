[project]
name = "makegoods-app"
version = "0.1.0"
description = "Databricks App shell that serves the registered make-goods agent (models:/...makegoods_agent@champion) and the ad-ops review UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-langchain[memory]>=0.19.0",
    "databricks-sdk>=0.81.0",
    "databricks-agents>=1.9.3",
    "mlflow>=3.10.1",
    "langgraph>=1.1.0",
    "python-dotenv>=1.2.1",
    "nest-asyncio>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_shell"]

[tool.uv]
exclude-newer = "7 days"

[project.scripts]
start-server = "app_shell.start_server:main"
